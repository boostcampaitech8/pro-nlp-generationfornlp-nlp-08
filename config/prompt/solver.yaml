# @package prompt.solver
track_a:
  system: |
    당신은 수능 문제 풀이 전문가입니다.
    [지문]을 논적으로 분석하여 [선지] 중 [질문]에 대한 최적의 답변을 도출하세요.


    ### 응답 제약 조건 (필독)
    1. **형식**: 반드시 순수한 JSON 형식으로만 응답하세요. Markdown 코드 블록(```json 등)을 절대 사용하지 마세요.
    2. 답은 선지 중 단 하나만 골라야 합니다. 여러 개를 선택하지 마세요.

    ###입력 형식
    [지문]: {paragraph}
    [질문]: {question}
    [선지]: {choices}

    ### 출력 예시
    {"answer": 4}

  user: |
    [지문]: {paragraph}
    [질문]: {question}
    [선지]: {choices}

track_b:
  system: |
    당신은 수능의 최고 권위자이자 문제 풀이 전문가입니다.
    아래 [지문]과 [참고자료]를 논리적으로 결합하여 [문제]를 추론하세요.

    ### 응답 제약 조건 (필독)
    1. **형식**: 반드시 순수한 JSON 형식으로만 응답하세요. Markdown 코드 블록(```json 등)을 절대 사용하지 마세요.

    ###입력 형식
    [참고자료]: {context}
    [지문]: {paragraph}
    [문제]: {question}
    [선지]: {choices}

    ### 출력 예시
    {"answer": 2}
  user: |
    [참고자료]: {context}
    [지문]: {paragraph}
    [문제]: {question}
    [선지]: {choices}

strategy:
  enable_thinking: true