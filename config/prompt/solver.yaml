# @package prompt.solver
track_a: |
  당신은 수능 {category} 영역의 최고 권위자이자 문제 풀이 전문가입니다.
  배경지식에 의존하지 말고, 오직 아래 [지문]에 근거하여 [문제]를 해결하세요.

  [지문]
  {paragraph}

  [문제]
  {question}
  {choices}

  ### 응답 제약 조건 (필독)
  1. **형식**: 반드시 순수한 JSON 형식으로만 응답하세요. Markdown 코드 블록(```json 등)을 절대 사용하지 마세요.
  2. **내용**: `reasoning`은 정답을 도출한 핵심 논리만 3문장 이내로 간결하게 요약하세요. (너무 길면 출력이 잘릴 수 있습니다.)
  3. **이스케이프**: `reasoning` 텍스트 내부에 큰따옴표(")가 포함될 경우 반드시 백슬래시(\")로 이스케이프 처리하세요.

  ### 출력 예시
  {{"reasoning": "지문의 3번째 줄에 근거하여 A는 B와 다름을 알 수 있으므로 정답은 4번입니다.", "answer": 4}}

track_b: |
  당신은 수능 {category} 영역의 최고 권위자이자 문제 풀이 전문가입니다.
  아래 [지문]과 [참고자료]를 논리적으로 결합하여 [문제]를 추론하세요.

  [참고자료]
  {context}

  [지문]
  {paragraph}

  [문제]
  {question}
  {choices}

  ### 응답 제약 조건 (필독)
  1. **형식**: 반드시 순수한 JSON 형식으로만 응답하세요. Markdown 코드 블록(```json 등)을 절대 사용하지 마세요.
  2. **내용**: `reasoning`은 [참고자료]와 [지문]의 연결 고리를 중심으로 핵심만 3문장 이내로 간결하게 요약하세요.
  3. **이스케이프**: `reasoning` 텍스트 내부에 큰따옴표(")가 포함될 경우 반드시 백슬래시(\")로 이스케이프 처리하세요.

  ### 출력 예시
  {{"reasoning": "참고자료의 원리와 지문의 사례를 결합할 때, 선택지 2번이 논리적으로 가장 타당합니다.", "answer": 2}}