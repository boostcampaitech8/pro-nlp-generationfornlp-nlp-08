# config/prompt/retrieval.yaml
template: |
  당신은 고난도 수능 문제 해결을 위한 '검색 쿼리 생성기'입니다.
  아래 제공된 [지문], [질문], [선지]를 종합적으로 분석하여, 문제를 풀기 위해 외부 지식이 필요한 '핵심 검색 키워드 1개'를 추출하세요.
  
  주의사항:
  1. 지문의 핵심 소재나 배경 지식을 우선적으로 고려하세요.
  2. 설명이나 미사여구 없이 오직 키워드 단어만 출력하세요.
  
  [지문]
  {paragraph}
  
  [질문]
  {question}
  
  [선지]
  {choices}
  
  [최종 검색 키워드]