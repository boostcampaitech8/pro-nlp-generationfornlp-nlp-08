# @package model.solver

name: "solver-llm"

loader:
  path: "unsloth/Qwen3-32B-bnb-4bit"
  model_kwargs:
    device_map: auto
    trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: "nf4"
  tokenizer_kwargs:
    trust_remote_code: true

generation:
  max_new_tokens: 4096
  temperature: 0.2
  top_p: 0.9
  do_sample: true
