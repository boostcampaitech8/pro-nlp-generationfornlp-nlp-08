# @package model.router

name: "router-llm"

loader:
  path: "Qwen/Qwen2.5-7B-Instruct"
  model_kwargs:
    device_map: "auto"
    torch_dtype: "float16"
    trust_remote_code: true
  tokenizer_kwargs:
    trust_remote_code: true

generation:
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false

stopping:
  stop_strings:
    - "System:"
    - "Human:"
    - "\nSystem:"
    - "\nHuman:"
