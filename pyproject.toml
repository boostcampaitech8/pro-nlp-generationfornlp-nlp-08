[project]
name = "suneung-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.0",
    "ddgs>=9.10.0",
    "evaluate==0.4.3",
    "flagembedding>=1.3.5",
    "hydra-core>=1.3.2",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "langchain>=1.2.0",
    "langgraph>=1.0.5",
    "langgraph-cli[inmem]>=0.4.11",
    "langsmith>=0.5.0",
    "matplotlib==3.9.2",
    "numpy==1.26.4",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.12.1",
    "requests==2.32.5",
    "scikit-learn==1.5.2",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "unsloth[colab-new]",
    "wandb>=0.23.1",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "black[jupyter]>=25.12.0",
    "ipykernel>=6.29.5",
]

[tool.uv.sources]
unsloth = { git = "https://github.com/unslothai/unsloth.git" }


[tool.black]
line-length = 79           # 한 줄 최대 길이
target-version = ['py311'] # 프로젝트의 파이썬 버전
include = '\.(py|pyi|ipynb)$'       # 포맷팅할 파일 확장자
exclude = '''
/(
    \.git
    | \.venv
)/
'''
